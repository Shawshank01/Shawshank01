name: Update GitHub activity chart

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-activity.yml
      - .github/scripts/update-github-activity.py
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: github-activity-chart

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Generate contribution chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-github-activity.py
      - name: Publish updated chart
        run: |
          git add assets/github-activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update GitHub activity chart'
          git pull --rebase origin main
          git push origin HEAD:main
